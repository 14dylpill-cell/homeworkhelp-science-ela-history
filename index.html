<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Homework Help Hub</title>

<link rel="icon" href="">

<style>
body {
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 0;
    background-color: #f4f4f4;
}

header {
    background-color: #333;
    color: white;
    padding: 1em;
    text-align: center;
}

nav {
    display: flex;
    justify-content: center;
    background-color: #555;
    flex-wrap: wrap;
}

nav a, nav button {
    color: white;
    padding: 1em 2em;
    text-decoration: none;
    background: none;
    border: none;
    cursor: pointer;
}

nav a:hover, nav button:hover {
    background-color: #777;
}

section {
    padding: 2em;
    text-align: center;
}

.help-section {
    margin: 2em auto;
    width: 80%;
    background: white;
    padding: 1.5em;
    border-radius: 8px;
    box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
}

.help-item {
    margin-bottom: 2em;
}

a {
    color: #0066cc;
    text-decoration: none;
}

a:hover {
    text-decoration: underline;
}
</style>

</head>

<body>

<header>
    <h1>Welcome to the Homework Help Hub</h1>
</header>

<nav>
    <a href="#math-help">Math Help</a>
    <a href="about.html">About Us</a>
    <a href="settings.html">Settings</a>

    <!-- 🔴 Panic Button -->
    <button onclick="window.location.href='https://classroom.google.com'" style="background:red;">
        Panic
    </button>
</nav>

<section class="help-section" id="math-help">
    <h2>Math Help Resources</h2>

    <div class="help-item">

        <a href="https://www.khanacademy.org/math/calculus-1" target="_blank">Calculus Lessons</a>
    </div>
</section>

<section class="help-section" id="ela-help">

    <div class="help-item">
        <h3>Grammar Basics</h3>
        <a href="https://www.khanacademy.org/humanities/grammar" target="_blank">Grammar Lessons</a>

    <div class="help-item">
        <h3>Essay Writing Tips</h3>
        <a href="https://writingcenter.unc.edu/tips-and-tools/essay-writing/" target="_blank">Essay Writing Tips</a>

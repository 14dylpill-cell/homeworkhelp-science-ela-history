<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Homework Help Hub</title>

<style>
body {
    margin: 0;
    font-family: Arial;
    background: #f4f4f4;
}

/* HEADER */
header {
    background:#333;
    color:white;
    padding:15px;
    text-align:center;
}

/* NAV */
nav {
    display:flex;
    justify-content:center;
    background:#555;
}

nav a, nav button {
    color:white;
    padding:15px;
    background:none;
    border:none;
    cursor:pointer;
    text-decoration:none;
}

nav a:hover, nav button:hover {
    background:#777;
}

/* CONTENT */
section {
    padding:20px;
}

/* LOGIN */
#loginScreen {
    position:fixed;
    inset:0;
    background:#111;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    z-index:9999;
    color:white;
}

/* POPUP */
#popup {
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.6);
    justify-content:center;
    align-items:center;
    z-index:9998;
}

#popupBox {
    background:white;
    padding:20px;
    width:300px;
    text-align:center;
}
</style>
</head>

<body>

<!-- 🔐 LOGIN (ALWAYS FIRST) -->
<div id="loginScreen">
    <h2>Login</h2>
    <input id="user" placeholder="Username" style="padding:10px;margin:5px;">
    <input id="pass" type="password" placeholder="Password" style="padding:10px;margin:5px;">
    <button onclick="login()" style="padding:10px;">Enter</button>
</div>

<!-- 🚀 POPUP -->
<div id="popup">
    <div id="popupBox">
        <h3>Version 1.0</h3>
        <p>Welcome to Homework Help Hub</p>
        <button onclick="closePopup()">Close</button>
    </div>
</div>

<!-- HEADER -->
<header>
    <h1>Homework Help Hub</h1>
</header>

<!-- NAV -->
<nav>
    <a href="#math">Math Help</a>
    <a href="#ela">ELA Help</a>
    <a href="settings.html">Settings</a>

    <button onclick="window.location.href='https://classroom.google.com'" style="background:red;">
        Panic
    </button>
</nav>

<!-- CONTENT -->
<section id="math">
    <h2>Math Help</h2>
    <p>Algebra, Geometry, Calculus</p>
</section>

<section id="ela">
    <h2>ELA Help</h2>
    <p>Grammar and Writing</p>
</section>

<script>
function login() {
    const u = document.getElementById("user").value;
    const p = document.getElementById("pass").value;

    if (!u || !p) return alert("Enter login info");

    localStorage.setItem("user", u);
    localStorage.setItem("pass", p);

    document.getElementById("loginScreen").style.display = "none";

    document.getElementById("popup").style.display = "flex";
}

function closePopup() {
    document.getElementById("popup").style.display = "none";
}

// auto login
window.onload = function() {
    const u = localStorage.getItem("user");
    const p = localStorage.getItem("pass");

    if (u && p) {
        document.getElementById("loginScreen").style.display = "none";
    }
};
</script>

</body>
</html>

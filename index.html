<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Homework Help Hub</title>

<link rel="icon" href="">

<script>
const currentVersion = "1.0";

window.addEventListener("load", function () {

    // 🎨 Theme
    const color = localStorage.getItem("bgColor");
    if (color) document.body.style.backgroundColor = color;

    // 🏷 Title
    const title = localStorage.getItem("siteTitle");
    if (title) document.title = title;

    // 🖼 Icon
    const icon = localStorage.getItem("siteIcon");
    if (icon) {
        let link = document.querySelector("link[rel='icon']");
        if (!link) {
            link = document.createElement("link");
            link.rel = "icon";
            document.head.appendChild(link);
        }
        link.href = icon;
    }

    // 🔐 LOGIN CHECK
    const user = localStorage.getItem("user");
    const pass = localStorage.getItem("pass");

    if (user && pass) {
        document.getElementById("loginScreen").style.display = "none";
    }

    // 🚀 POPUP
    const seen = localStorage.getItem("seenVersion");
    if (seen !== currentVersion) {
        document.getElementById("updatePopup").style.display = "flex";
    }

});

// 🔐 LOGIN
function login() {
    const user = document.getElementById("username").value;
    const pass = document.getElementById("password").value;

    if (!user || !pass) {
        alert("Enter username and password");
        return;
    }

    localStorage.setItem("user", user);
    localStorage.setItem("pass", pass);

    document.getElementById("loginScreen").style.display = "none";
}

// 🚪 CLOSE POPUP
function closePopup() {
    document.getElementById("updatePopup").style.display = "none";
    localStorage.setItem("seenVersion", currentVersion);
}

</script>

<style>
body {
    font-family: Arial;
    margin: 0;
    background: #f4f4f4;
}

/* NAV */
nav {
    display:flex;
    justify-content:center;
    background:#555;
    align-items:center;
}
nav a, nav button {
    color:white;
    padding:15px;
    background:none;
    border:none;
    cursor:pointer;
}
nav a:hover, nav button:hover {
    background:#777;
}

/* LOGIN SCREEN */
#loginScreen {
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:#111;
    color:white;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    z-index:10000;
}

/* POPUP */
#updatePopup {
    display:none;
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.6);
    justify-content:center;
    align-items:center;
    z-index:9999;
}

#popupBox {
    background:white;
    padding:20px;
    width:320px;
    border-radius:10px;
    text-align:center;
}

/* LASER FRAME */
#frame {
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    pointer-events:none;
    border:4px solid cyan;
    box-shadow: inset 0 0 40px cyan, 0 0 30px cyan;
    z-index:9998;
}
</style>

</head>

<body>

<!-- 🔐 LOGIN -->
<div id="loginScreen">
    <h2>🔐 Login</h2>
    <input id="username" placeholder="Username" style="padding:10px;margin:5px;">
    <input id="password" type="password" placeholder="Password" style="padding:10px;margin:5px;">
    <button onclick="login()">Enter Site</button>
</div>

<!-- 🚀 POPUP -->
<div id="updatePopup">
    <div id="popupBox">
        <h2>🚀 Version 1.0</h2>
        <p>Welcome to Homework Help Hub!</p>
        <ul style="text-align:left;">
            <li>Admin Panel Added</li>
            <li>Settings System</li>
            <li>Panic Button</li>
            <li>Launcher</li>
        </ul>
        <button onclick="closePopup()">Close</button>
    </div>
</div>

<!-- ⚡ LASER FRAME -->
<div id="frame"></div>

<!-- HEADER -->
<header>
<h1>Homework Help Hub</h1>
</header>

<!-- NAV -->
<nav>
<a href="#math-help">Math Help</a>
<a href="about.html">About</a>
<a href="settings.html">Settings</a>
<a href="admin.html">Admin</a>

<button onclick="window.location.href='https://classroom.google.com'"
style="background:red;">
Panic
</button>
</nav>

<!-- CONTENT -->
<section id="math-help" style="padding:20px;">
<h2>Math Help</h2>
<p>Algebra, Geometry, Calculus resources</p>
</section>

<section id="ela-help" style="padding:20px;">
<h2>ELA Help</h2>
<p>Grammar and Writing resources</p>
</section>

</body>
</html>

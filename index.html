<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Homework Help Hub</title>

<style>
body {
    margin: 0;
    font-family: Arial;
    background: #f4f4f4;
}

/* NAV */
nav {
    display: flex;
    justify-content: center;
    background: #555;
    flex-wrap: wrap;
}

nav a, nav button {
    color: white;
    padding: 15px 20px;
    border: none;
    background: none;
    cursor: pointer;
    text-decoration: none;
}

nav a:hover, nav button:hover {
    background: #777;
}

/* SECTIONS */
.section {
    width: 85%;
    max-width: 900px;
    margin: 25px auto;
    background: white;
    padding: 20px;
    border-radius: 10px;
}

/* NOTIFICATIONS */
#notifContainer {
    position: fixed;
    top: 15px;
    right: 15px;
    z-index: 9999;
}

.notif {
    background: #222;
    color: white;
    padding: 12px;
    margin-bottom: 10px;
    border-radius: 8px;
    width: 220px;
}
</style>
</head>

<body>

<div id="notifContainer"></div>

<nav>
    <a href="about.html">About Us</a>
    <a href="launcher.html">Launcher</a>
    <a href="settings.html">Settings</a>
    <button onclick="openAdmin()">Admin</button>
    <button onclick="window.location.href='https://classroom.google.com'" style="background:red;">Panic</button>
</nav>

<!-- MAIN CONTENT -->
<section class="section">
    <h2>Math Help</h2>
    <a href="https://www.khanacademy.org/math" target="_blank">Khan Academy Math</a>
    <br><br>
    <a href="https://www.khanacademy.org/math/algebra" target="_blank">Algebra Help</a>
</section>

<section class="section">
    <h2>ELA Help</h2>
    <a href="https://www.khanacademy.org/humanities" target="_blank">Khan Academy ELA</a>
    <br><br>
    <a href="https://www.grammarly.com" target="_blank">Grammarly</a>
</section>

<!-- ADMIN -->
<div id="adminPanel" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8);">
    <div style="background:white; padding:20px; width:300px; margin:100px auto; text-align:center;">
        <h3>Admin Access</h3>
        <input id="adminCode" placeholder="Code">
        <br><br>
        <button onclick="checkAdmin()">Enter</button>
        <button onclick="closeAdmin()">Close</button>

        <div id="adminTools" style="display:none; margin-top:15px;">
            <button onclick="showNotification('Test','Admin button works')">Test Alert</button>
            <button onclick="document.body.style.background='lightblue'">Blue Mode</button>
            <button onclick="document.body.style.background='#f4f4f4'">Reset</button>
        </div>
    </div>
</div>

<script>
function showNotification(title, message) {
    const c = document.getElementById("notifContainer");
    const n = document.createElement("div");
    n.className = "notif";
    n.innerHTML = "<b>"+title+"</b><br>"+message;
    n.onclick = () => n.remove();
    c.appendChild(n);
    setTimeout(()=>n.remove(),5000);
}

window.onload = () => {
    showNotification("Welcome 👋","Everything is running normally");
};

function openAdmin(){
    document.getElementById("adminPanel").style.display="block";
}

function closeAdmin(){
    document.getElementById("adminPanel").style.display="none";
}

function checkAdmin(){
    if(document.getElementById("adminCode").value==="1234"){
        document.getElementById("adminTools").style.display="block";
    } else {
        alert("Wrong code");
    }
}
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Homework Hub</title>

<style>
body{
    margin:0;
    font-family:Arial;
    background:#f4f4f4;
}

h1{
    text-align:center;
    margin:15px 0;
}

nav{
    background:#555;
    padding:10px;
    text-align:center;
}

nav a, nav button{
    color:white;
    text-decoration:none;
    padding:10px 12px;
    border:none;
    background:none;
    cursor:pointer;
}

nav a:hover, nav button:hover{
    background:#777;
}

.section{
    background:white;
    margin:20px;
    padding:15px;
    border-radius:10px;
}

/* notifications */
#notif{
    position:fixed;
    top:10px;
    right:10px;
}
</style>
</head>

<body>

<h1>Homework Hub</h1>

<div id="notif"></div>

<nav>
    <a href="about.html">About Us</a>
    <a href="settings.html">Settings</a>
    <a href="launcher.html">Launcher</a>

    <button onclick="window.location.href='https://classroom.google.com'">Panic</button>

    <button onclick="openAdmin()">Admin</button>
</nav>

<div class="section">
    <h2>Khan Academy Help</h2>
    <a href="https://www.khanacademy.org/math" target="_blank">Khan Academy Help</a>
</div>

<div class="section">
    <h2>Khan Academy ELA</h2>
    <a href="https://www.khanacademy.org/humanities" target="_blank">Khan Academy ELA</a>
</div>

<!-- ADMIN -->
<div id="admin" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.7);">
    <div style="background:white;width:300px;margin:100px auto;padding:20px;text-align:center;">
        <h3>Admin</h3>
        <input id="code" placeholder="Code">
        <br><br>
        <button onclick="checkAdmin()">Enter</button>
        <button onclick="closeAdmin()">Close</button>

        <div id="tools" style="display:none;margin-top:10px;">
            <button onclick="document.body.style.background='lightblue'">Blue Mode</button>
            <button onclick="document.body.style.background='#f4f4f4'">Reset</button>
            <button onclick="alert('System OK')">System Check</button>
        </div>
    </div>
</div>

<script>
function openAdmin(){
    document.getElementById("admin").style.display="block";
}

function closeAdmin(){
    document.getElementById("admin").style.display="none";
}

function checkAdmin(){
    if(document.getElementById("code").value==="1234"){
        document.getElementById("tools").style.display="block";
    } else {
        alert("Wrong code");
    }
}

/* APPLY SETTINGS */
window.onload = () => {
    const bg = localStorage.getItem("bg");
    const title = localStorage.getItem("title");

    if(bg){
        document.body.style.background = bg;
    }

    if(title){
        document.title = title;
    }
};
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Homework Help Hub</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f4f4f4;
}

header {
    background: #333;
    color: white;
    text-align: center;
    padding: 25px;
}

nav {
    display: flex;
    justify-content: center;
    background: #555;
    flex-wrap: wrap;
}

nav a, nav button {
    color: white;
    padding: 15px 20px;
    text-decoration: none;
    border: none;
    background: none;
    cursor: pointer;
}

nav a:hover, nav button:hover {
    background: #777;
}

.section {
    width: 85%;
    max-width: 900px;
    margin: 25px auto;
    background: white;
    padding: 20px;
    border-radius: 10px;
}

.link {
    display: block;
    padding: 12px;
    margin: 10px 0;
    background: #0066cc;
    color: white;
    text-decoration: none;
    border-radius: 6px;
}

/* NOTIFICATIONS */
#notifContainer {
    position: fixed;
    top: 15px;
    right: 15px;
    z-index: 9999;
}

.notif {
    background: #222;
    color: white;
    padding: 12px 15px;
    margin-bottom: 10px;
    border-radius: 8px;
    width: 220px;
    font-size: 13px;
}
</style>
</head>

<body>

<div id="notifContainer"></div>

<header>
    <h1>Homework Help Hub</h1>
</header>

<nav>
    <a href="games.html">Games</a>
    <a href="launcher.html">Launcher</a>
    <a href="settings.html">Settings</a>

    <button onclick="window.location.href='https://classroom.google.com'" style="background:red;">
        🔴 Panic
    </button>
</nav>

<!-- MATH -->
<section class="section">
    <h2>Math Help</h2>
    <a class="link" href="https://www.khanacademy.org/math" target="_blank">Khan Academy Math</a>
    <a class="link" href="https://www.khanacademy.org/math/algebra" target="_blank">Algebra Help</a>
</section>

<!-- ELA -->
<section class="section">
    <h2>ELA Help</h2>
    <a class="link" href="https://www.khanacademy.org/humanities" target="_blank">Khan Academy ELA</a>
    <a class="link" href="https://www.grammarly.com" target="_blank">Grammarly</a>
</section>

<script>
function showNotification(title, message) {
    const container = document.getElementById("notifContainer");

    const notif = document.createElement("div");
    notif.className = "notif";
    notif.innerHTML = "<b>" + title + "</b><br>" + message;

    notif.onclick = () => notif.remove();

    container.appendChild(notif);

    setTimeout(() => notif.remove(), 5000);
}

window.addEventListener("load", () => {
    showNotification("Welcome 👋", "Homework Help Hub loaded");

    const bg = localStorage.getItem("bgColor");
    if (bg) document.body.style.background = bg;
});
</script>

</body>
</html>

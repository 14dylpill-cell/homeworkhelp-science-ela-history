<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Homework Help Hub</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f4f4f4;
}

/* HEADER */
header {
    background: #333;
    color: white;
    text-align: center;
    padding: 25px;
}

/* NAV */
nav {
    display: flex;
    justify-content: center;
    background: #555;
    flex-wrap: wrap;
}

nav a, nav button {
    color: white;
    padding: 15px 20px;
    text-decoration: none;
    background: none;
    border: none;
    cursor: pointer;
}

nav a:hover, nav button:hover {
    background: #777;
}

/* SECTIONS */
.section {
    width: 85%;
    max-width: 1000px;
    margin: 30px auto;
    background: white;
    padding: 20px;
    border-radius: 10px;
    box-shadow: 0 0 10px rgba(0,0,0,0.1);
}

/* LINKS FIX */
a {
    position: relative;
    z-index: 2;
}

/* NOTIFICATIONS */
#notifContainer {
    position: fixed;
    top: 15px;
    right: 15px;
    z-index: 9999;
}

.notif {
    background: #222;
    color: white;
    padding: 12px 15px;
    margin-bottom: 10px;
    border-radius: 8px;
    width: 220px;
    cursor: pointer;
    font-size: 13px;
}
</style>
</head>

<body>

<!-- NOTIFICATIONS -->
<div id="notifContainer"></div>

<header>
    <h1>Homework Help Hub</h1>
    <p>Resources and Tools</p>
</header>

<nav>
    <a href="https://www.khanacademy.org/math" target="_blank">Math Help</a>
    <a href="https://www.khanacademy.org/humanities" target="_blank">ELA Help</a>
    <a href="games.html">Games</a>
    <a href="settings.html">Settings</a>

    <button onclick="window.location.href='https://classroom.google.com'"
    style="background:red;">
        🔴 Panic
    </button>
</nav>

<section class="section">
    <h2>Math Help</h2>
    <a href="https://www.khanacademy.org/math" target="_blank">Open Math Resources</a>
</section>

<section class="section">
    <h2>ELA Help</h2>
    <a href="https://www.khanacademy.org/humanities" target="_blank">Open ELA Resources</a>
</section>

<script>
function showNotification(title, message) {
    const container = document.getElementById("notifContainer");

    const notif = document.createElement("div");
    notif.className = "notif";

    notif.innerHTML = "<b>" + title + "</b><br>" + message;

    notif.onclick = () => notif.remove();

    container.appendChild(notif);

    setTimeout(() => notif.remove(), 6000);
}

window.addEventListener("load", () => {
    showNotification("Welcome 👋", "Homework Help Hub loaded");
    showNotification("v1.0", "All systems working");
});
</script>

</body>
</html>

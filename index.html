<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Homework Help Hub</title>

<link rel="icon" href="">

<style>
body {
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 0;
    background-color: #f4f4f4;
}

/* HEADER */
header {
    background-color: #333;
    color: white;
    padding: 1em;
    text-align: center;
}

/* NAV */
nav {
    display: flex;
    justify-content: center;
    background-color: #555;
    flex-wrap: wrap;
}

nav a, nav button {
    color: white;
    padding: 1em 2em;
    text-decoration: none;
    background: none;
    border: none;
    cursor: pointer;
}

nav a:hover, nav button:hover {
    background-color: #777;
}

/* SECTIONS */
section {
    padding: 2em;
    text-align: center;
}

.help-section {
    margin: 2em auto;
    width: 80%;
    background: white;
    padding: 1.5em;
    border-radius: 8px;
    box-shadow: 0 0 10px rgba(0,0,0,0.1);
}

/* 🔔 NOTIFICATIONS */
#notifContainer {
    position: fixed;
    top: 15px;
    right: 15px;
    z-index: 9999;
}

.notification {
    background: #333;
    color: white;
    padding: 12px 15px;
    margin-bottom: 10px;
    border-radius: 8px;
    width: 220px;
    box-shadow: 0 0 10px rgba(0,0,0,0.3);
    cursor: pointer;
    font-size: 14px;
}
</style>

</head>

<body>

<!-- 🔔 NOTIFICATION AREA -->
<div id="notifContainer"></div>

<!-- HEADER -->
<header>
    <h1>Homework Help Hub</h1>
</header>

<!-- NAV -->
<nav>
    <a href="#math-help">Math Help</a>
    <a href="#ela-help">ELA Help</a>
    <a href="about.html">About</a>
    <a href="settings.html">Settings</a>

    <!-- 🔴 PANIC BUTTON -->
    <button onclick="window.location.href='https://classroom.google.com'"
    style="background:red;">
        Panic
    </button>
</nav>

<!-- CONTENT -->
<section class="help-section" id="math-help">
    <h2>Math Help</h2>
    <p>Algebra, Geometry, Calculus resources</p>
</section>

<section class="help-section" id="ela-help">
    <h2>ELA Help</h2>
    <p>Grammar and Writing resources</p>
</section>

<!-- SCRIPT -->
<script>

// 🎨 Load settings
window.addEventListener("load", function () {

    const color = localStorage.getItem("bgColor");
    if (color) document.body.style.backgroundColor = color;

    const title = localStorage.getItem("siteTitle");
    if (title) document.title = title;

    const icon = localStorage.getItem("siteIcon");
    if (icon) {
        let link = document.querySelector("link[rel='icon']");
        if (!link) {
            link = document.createElement("link");
            link.rel = "icon";
            document.head.appendChild(link);
        }
        link.href = icon;
    }

    showNotification("Welcome 👋", "Homework Help Hub loaded successfully!");
});

// 🔔 Notification system
function showNotification(title, message) {
    const container = document.getElementById("notifContainer");

    const notif = document.createElement("div");
    notif.className = "notification";

    notif.innerHTML = "<b>" + title + "</b><br>" + message;

    notif.onclick = () => notif.remove();

    container.appendChild(notif);

    setTimeout(() => {
        notif.remove();
    }, 6000);
}

</script>

</body>
</html>

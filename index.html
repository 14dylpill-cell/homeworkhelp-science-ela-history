<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Homework Hub</title>

<style>
body{
    margin:0;
    font-family:Arial;
    background:#f4f4f4;
}

/* TITLE */
h1{
    text-align:center;
    margin:15px 0;
}

/* NAV */
nav{
    background:#555;
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
}

nav a, nav button{
    color:white;
    padding:12px 15px;
    text-decoration:none;
    background:none;
    border:none;
    cursor:pointer;
}

nav a:hover, nav button:hover{
    background:#777;
}

/* SECTIONS */
.section{
    width:85%;
    max-width:900px;
    margin:20px auto;
    background:white;
    padding:15px;
    border-radius:10px;
}

/* NOTIFICATIONS */
#notifContainer{
    position:fixed;
    top:10px;
    right:10px;
    z-index:9999;
}

.notif{
    background:#222;
    color:white;
    padding:10px;
    margin-bottom:10px;
    border-radius:8px;
    cursor:pointer;
    font-size:13px;
}

/* ADMIN POPUP */
#adminPanel{
    display:none;
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.7);
}

.adminBox{
    background:white;
    width:300px;
    margin:120px auto;
    padding:20px;
    text-align:center;
    border-radius:10px;
}
</style>
</head>

<body>

<!-- NOTIFICATIONS -->
<div id="notifContainer"></div>

<h1>Homework Hub</h1>

<nav>
    <a href="about.html">About Us</a>
    <a href="settings.html">Settings</a>
    <a href="launcher.html">Launcher</a>

    <button onclick="openAdmin()">Admin</button>
    <button onclick="window.location.href='https://classroom.google.com'">Panic</button>
</nav>

<!-- KHAN ACADEMY -->
<div class="section">
    <h2>Khan Academy Help</h2>
    <a href="https://www.khanacademy.org/math" target="_blank">Open Math Help</a>
</div>

<div class="section">
    <h2>Khan Academy ELA Help</h2>
    <a href="https://www.khanacademy.org/humanities" target="_blank">Open ELA Help</a>
</div>

<!-- ADMIN PANEL -->
<div id="adminPanel">
    <div class="adminBox">
        <h3>Admin</h3>
        <input id="adminCode" placeholder="Enter code">
        <br><br>
        <button onclick="checkAdmin()">Enter</button>
        <button onclick="closeAdmin()">Close</button>

        <div id="adminTools" style="display:none;margin-top:10px;">
            <button onclick="document.body.style.background='lightblue'">Blue Mode</button>
            <button onclick="document.body.style.background='#f4f4f4'">Reset</button>
            <button onclick="alert('System OK')">System Check</button>
        </div>
    </div>
</div>

<script>

/* NOTIFICATIONS */
function showNotification(title, message){
    const container = document.getElementById("notifContainer");

    const notif = document.createElement("div");
    notif.className = "notif";
    notif.innerHTML = "<b>" + title + "</b><br>" + message;

    notif.onclick = () => notif.remove();
    container.appendChild(notif);

    setTimeout(() => notif.remove(), 5000);
}

window.onload = () => {

    /* notifications */
   showNotification("WELCOME TO v1.0", "LOADING...");


    /* settings apply */
    const bg = localStorage.getItem("bg");
    const title = localStorage.getItem("title");

    if(bg){
        document.body.style.background = bg;
    }

    if(title){
        document.title = title;
    }
};

/* ADMIN */
function openAdmin(){
    document.getElementById("adminPanel").style.display="block";
}

function closeAdmin(){
    document.getElementById("adminPanel").style.display="none";
}

function checkAdmin(){
    if(document.getElementById("adminCode").value === "1234"){
        document.getElementById("adminTools").style.display="block";
    } else {
        alert("Wrong code");
    }
}
</script>

</body>
</html>

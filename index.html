<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Homework Help Hub</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f4f4f4;
}

header {
    background: #333;
    color: white;
    text-align: center;
    padding: 25px;
}

nav {
    display: flex;
    justify-content: center;
    background: #555;
    flex-wrap: wrap;
}

nav a, nav button {
    color: white;
    padding: 15px 20px;
    text-decoration: none;
    border: none;
    background: none;
    cursor: pointer;
}

nav a:hover, nav button:hover {
    background: #777;
}

.section {
    width: 85%;
    max-width: 900px;
    margin: 25px auto;
    background: white;
    padding: 20px;
    border-radius: 10px;
}

/* ADMIN PANEL */
#adminPanel {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.8);
    justify-content: center;
    align-items: center;
}

.adminBox {
    background: white;
    padding: 25px;
    border-radius: 10px;
    text-align: center;
    width: 300px;
}

.adminTools {
    display: none;
    margin-top: 15px;
}
</style>
</head>

<body>

<header>
    <h1>Homework Help Hub</h1>
</header>

<nav>
    <a href="games.html">Games</a>
    <a href="launcher.html">Launcher</a>
    <a href="settings.html">Settings</a>

    <!-- ADMIN BUTTON (VISIBLE) -->
    <button onclick="openAdmin()">Admin</button>

    <button onclick="window.location.href='https://classroom.google.com'" style="background:red;">
        🔴 Panic
    </button>
</nav>

<!-- ADMIN PANEL -->
<div id="adminPanel">
    <div class="adminBox">
        <h2>Admin Access</h2>

        <input id="adminCode" placeholder="Enter code">

        <br><br>

        <button onclick="checkAdmin()">Enter</button>
        <button onclick="closeAdmin()">Close</button>

        <div class="adminTools" id="adminTools">
            <h3>Admin Tools</h3>
            <button onclick="alert('Tool 1 activated')">Tool 1</button>
            <button onclick="alert('Tool 2 activated')">Tool 2</button>
            <button onclick="alert('System check complete')">System Check</button>
        </div>
    </div>
</div>

<!-- CONTENT -->
<section class="section">
    <h2>Welcome</h2>
    <p>Everything is running normally.</p>
</section>

<script>
function openAdmin() {
    document.getElementById("adminPanel").style.display = "flex";
}

function closeAdmin() {
    document.getElementById("adminPanel").style.display = "none";
}

function checkAdmin() {
    const code = document.getElementById("adminCode").value;

    if (code === "1234") {
        document.getElementById("adminTools").style.display = "block";
    } else {
        alert("Wrong code");
    }
}
</script>

</body>
</html>

<!DOCTYPE html>
<html>
<head>
<title>Homework Hub</title>

<style>
body{font-family:Arial;margin:0;background:#f4f4f4;}

nav{
  background:#555;
  padding:10px;
  text-align:center;
}

nav a, nav button{
  color:white;
  text-decoration:none;
  padding:10px 12px;
  border:none;
  background:none;
  cursor:pointer;
}

nav button:hover, nav a:hover{
  background:#777;
}

.section{
  background:white;
  margin:20px;
  padding:15px;
  border-radius:10px;
}
</style>
</head>

<body>

<nav>
  <a href="about.html">About Us</a>
  <a href="settings.html">Settings</a>

  <a href="launcher.html">Launcher</a>

  <button onclick="window.location.href='https://classroom.google.com'">
    Panic
  </button>

  <button onclick="openAdmin()">Admin</button>
</nav>

<!-- KHAN ACADEMY SECTION -->
<div class="section">
  <h2>Khan Academy Help</h2>
  <a href="https://www.khanacademy.org/math" target="_blank">
    Khan Academy Help
  </a>
</div>

<div class="section">
  <h2>Khan Academy ELA</h2>
  <a href="https://www.khanacademy.org/humanities" target="_blank">
    Khan Academy ELA
  </a>
</div>

<!-- ADMIN PANEL -->
<div id="adminPanel" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.8);">
  <div style="background:white;width:300px;margin:100px auto;padding:20px;text-align:center;">
    <h3>Admin</h3>
    <input id="code" placeholder="Code">
    <br><br>
    <button onclick="check()">Enter</button>
    <button onclick="closeAdmin()">Close</button>

    <div id="tools" style="display:none;margin-top:10px;">
      <button onclick="document.body.style.background='lightblue'">Blue Mode</button>
      <button onclick="document.body.style.background='#f4f4f4'">Reset</button>
      <button onclick="alert('OK')">System Check</button>
    </div>
  </div>
</div>

<script>
function openAdmin(){
  document.getElementById("adminPanel").style.display="block";
}

function closeAdmin(){
  document.getElementById("adminPanel").style.display="none";
}

function check(){
  if(document.getElementById("code").value==="1234"){
    document.getElementById("tools").style.display="block";
  } else {
    alert("Wrong code");
  }
}
</script>

</body>
</html>

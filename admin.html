<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel</title>
</head>

<body style="font-family: Arial; text-align: center; padding: 30px;">

    <h1>Admin Access</h1>

    <p>Enter password to continue:</p>

    <input type="password" id="password" placeholder="Enter code">
    <button onclick="checkPassword()">Login</button>

    <br><br>

    <a href="index.html">
        <button>Back Home</button>
    </a>

    <!-- 🔒 Hidden Admin Panel -->
    <div id="adminPanel" style="display:none; margin-top:30px;">

        <h2>Welcome Admin</h2>
        <p>You now have access to special tools.</p>

        <button onclick="alert('Admin tool 1 activated')">Tool 1</button>
        <button onclick="alert('Admin tool 2 activated')">Tool 2</button>

    </div>

    <script>
        function checkPassword() {
            const pass = document.getElementById("password").value;

            if (pass === "1234") {
                document.getElementById("adminPanel").style.display = "block";
            } else {
                alert("Wrong password");
            }
        }
    </script>

</body>
</html>

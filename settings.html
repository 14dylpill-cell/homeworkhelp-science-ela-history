<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Settings</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f4f4f4;
}

header {
    background: #333;
    color: white;
    text-align: center;
    padding: 25px;
}

.container {
    width: 85%;
    max-width: 700px;
    margin: 30px auto;
    background: white;
    padding: 20px;
    border-radius: 10px;
    box-shadow: 0 0 10px rgba(0,0,0,0.1);
}

label {
    display: block;
    margin-top: 15px;
    font-weight: bold;
}

input {
    width: 100%;
    padding: 10px;
    margin-top: 5px;
    border-radius: 6px;
    border: 1px solid #ccc;
}

button {
    margin-top: 20px;
    padding: 12px;
    width: 100%;
    border: none;
    border-radius: 8px;
    background: #0066cc;
    color: white;
    font-size: 16px;
    cursor: pointer;
}

button:hover {
    background: #004f99;
}

.exit {
    background: #555;
}
.exit:hover {
    background: #333;
}
</style>
</head>

<body>

<header>
    <h1>Settings</h1>
</header>

<div class="container">

    <label>Website Title</label>
    <input id="titleInput" placeholder="Enter new title">

    <label>Background Color</label>
    <input id="colorInput" placeholder="Example: #f4f4f4">

    <button onclick="applySettings()">Apply</button>

    <button class="exit" onclick="goBack()">Exit</button>

</div>

<script>
function applySettings() {
    const title = document.getElementById("titleInput").value;
    const color = document.getElementById("colorInput").value;

    if (title) {
        localStorage.setItem("siteTitle", title);
    }

    if (color) {
        localStorage.setItem("bgColor", color);
    }

    alert("Settings saved!");
}

function goBack() {
    window.location.href = "index.html";
}
</script>

</body>
</html>

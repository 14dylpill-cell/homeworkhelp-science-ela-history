<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Settings</title>

<style>
body {
    margin:0;
    font-family: Arial;
    background:#f4f4f4;
}

.container {
    width:80%;
    max-width:600px;
    margin:40px auto;
    background:white;
    padding:20px;
    border-radius:10px;
}

input {
    width:100%;
    padding:10px;
    margin:10px 0;
}

button {
    width:100%;
    padding:12px;
    background:#0066cc;
    color:white;
    border:none;
    cursor:pointer;
}
</style>
</head>

<body>

<div class="container">
    <h2>Settings</h2>

    <input id="bg" placeholder="Background color">
    <input id="title" placeholder="Tab title">

    <button onclick="save()">Apply</button>
    <button onclick="exit()">Exit</button>
</div>

<script>
function save(){
    localStorage.setItem("bgColor", document.getElementById("bg").value);
    localStorage.setItem("tabTitle", document.getElementById("title").value);
    alert("Saved");
}

function exit(){
    window.location.href="index.html";
}
</script>

</body>
</html>

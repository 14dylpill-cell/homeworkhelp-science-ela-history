<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Settings</title>

<style>
body {
    margin:0;
    font-family: Arial;
    background:#f4f4f4;
}

.container {
    width:80%;
    max-width:600px;
    margin:40px auto;
    background:white;
    padding:20px;
    border-radius:10px;
}

input {
    width:100%;
    padding:10px;
    margin:10px 0;
}

button {
    width:100%;
    padding:12px;
    border:none;
    background:#0066cc;
    color:white;
    cursor:pointer;
}
</style>
</head>

<body>

<div class="container">
    <h2>Settings</h2>

    <input id="bg" placeholder="Background color (e.g. lightblue)">
    <input id="title" placeholder="Website tab title">

    <button onclick="save()">Apply</button>
    <button onclick="exit()">Exit</button>
</div>

<script>
function save() {
    const bg = document.getElementById("bg").value;
    const title = document.getElementById("title").value;

    if (bg) {
        localStorage.setItem("bgColor", bg);
    }

    if (title) {
        localStorage.setItem("tabTitle", title);
    }

    alert("Settings saved!");
}

function exit() {
    window.location.href = "index.html";
}
</script>

</body>
</html>

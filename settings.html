<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Settings</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f4f4f4;
}

header {
    background: #333;
    color: white;
    text-align: center;
    padding: 25px;
}

.container {
    width: 80%;
    max-width: 600px;
    margin: 30px auto;
    background: white;
    padding: 20px;
    border-radius: 10px;
}

input {
    width: 100%;
    padding: 10px;
    margin: 10px 0;
}

button {
    width: 100%;
    padding: 12px;
    background: #0066cc;
    color: white;
    border: none;
    margin-top: 10px;
    cursor: pointer;
}

button:hover {
    background: #004f99;
}
</style>
</head>

<body>

<header>
    <h1>Settings</h1>
</header>

<div class="container">

    <input id="titleInput" placeholder="Enter site title">
    <input id="colorInput" placeholder="Enter background color (ex: #f4f4f4)">

    <button onclick="saveSettings()">Apply</button>
    <button onclick="exit()">Exit</button>

</div>

<script>
function saveSettings() {
    const title = document.getElementById("titleInput").value;
    const color = document.getElementById("colorInput").value;

    if (title) localStorage.setItem("siteTitle", title);
    if (color) localStorage.setItem("bgColor", color);

    alert("Saved!");
}

function exit() {
    window.location.href = "index.html";
}
</script>

</body>
</html>

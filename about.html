<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>About Us</title>

<style>
body {
    font-family: Arial;
    background:#f4f4f4;
    margin:0;
}

.container {
    width:80%;
    margin:40px auto;
    background:white;
    padding:20px;
    border-radius:10px;
}

#games {
    display:none;
    margin-top:20px;
}

a {
    display:block;
    margin:10px 0;
    padding:10px;
    background:#0066cc;
    color:white;
    text-decoration:none;
    border-radius:6px;
}
</style>
</head>

<body>

<div class="container">

<h1>About Us</h1>

<p>
We are a homework help platform built for students.
We provide learning tools, games, and resources.
</p>

<p>
Click the word: <span onclick="reveal()" style="color:blue; cursor:pointer;">games</span> hidden in text.
</p>

<div id="codeBox" style="display:none;">
    <input id="code" placeholder="Enter code">
    <button onclick="check()">Enter</button>
</div>

<div id="games">
    <h3>Secret Games</h3>
    <a href="https://worlder.worldmicroscope.com" target="_blank">Game 1</a>
    <a href="https://bxappeidj4iav6crormf7atzvi0iwpnq.lambda-url.us-east-2.on.aws" target="_blank">Game 2</a>
</div>

</div>

<script>
function reveal(){
    document.getElementById("codeBox").style.display="block";
}

function check(){
    if(document.getElementById("code").value==="0000"){
        document.getElementById("games").style.display="block";
    } else {
        alert("Wrong code");
    }
}
</script>

</body>
</html>

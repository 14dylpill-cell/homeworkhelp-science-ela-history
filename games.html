<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Games</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
        }

        header {
            background-color: #333;
            color: white;
            text-align: center;
            padding: 25px;
        }

        .games-container {
            width: 85%;
            max-width: 900px;
            margin: 30px auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        .game-button {
            display: block;
            width: 100%;
            box-sizing: border-box;
            text-align: center;
            background-color: #0066cc;
            color: white;
            text-decoration: none;
            padding: 15px;
            margin: 12px 0;
            border-radius: 8px;
            font-size: 18px;
            transition: background-color 0.2s;
        }

        .game-button:hover {
            background-color: #004f99;
        }
    </style>
</head>

<body>

    <header>
        <h1>Games</h1>
    </header>

    <div class="games-container">

        <a class="game-button"
           href="https://worlder.worldmicroscope.com"
           target="_blank">
            Game 1
        </a>

        <a class="game-button"
           href="https://bxappeidj4iav6crormf7atzvi0iwpnq.lambda-url.us-east-2.on.aws"
           target="_blank">
            Game 2
        </a>

    </div>

</body>
</html>

<!DOCTYPE html>
<html>
<head>
<title>Launcher</title>
<style>
body {
    margin: 0;
    font-family: Arial;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    background: #111;
    color: white;
}

button {
    padding: 15px 25px;
    font-size: 16px;
    border: none;
    cursor: pointer;
    background: #0066cc;
    color: white;
    border-radius: 8px;
}

button:hover {
    background: #004f99;
}
</style>
</head>

<body>

<button onclick="openApp()">Open Launcher</button>

<script>
function openApp() {
    const win = window.open(
        "index.html",
        "_blank",
        "width=1200,height=800"
    );

    if (!win) {
        alert("Popup blocked — allow popups for this site.");
    }
}
</script>

</body>
</html>

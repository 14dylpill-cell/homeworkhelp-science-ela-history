<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Launcher</title>

<style>
body{
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#111;
    font-family:Arial;
}

.container{
    text-align:center;
}

button{
    padding:18px 28px;
    background:#0066cc;
    color:white;
    border:none;
    border-radius:10px;
    font-size:16px;
    cursor:pointer;
}

button:hover{
    background:#004f99;
}

p{
    color:white;
    margin-top:12px;
    opacity:0.7;
}
</style>
</head>

<body>

<div class="container">
    <button onclick="launch()">Open App</button>
    <p>Launch Homework Hub</p>
</div>

<script>
function launch(){
    window.location.href = "index.html";
}
</script>

</body>
</html>
